# Exemplo completo de check OpenMetrics do Agent Datadog.
# NÃO versionar chaves. Copie este arquivo para a conf. do agent no lab (fora do Git).
#
# Documentação oficial do check:
# https://docs.datadoghq.com/integrations/openmetrics/

init_config:

instances:
  - openmetrics_endpoint: http://127.0.0.1:3000/metrics
    namespace: bentoml
    metrics:
      - bentoml_service_request_total
      - bentoml_service_request_duration_seconds_bucket
      - bentoml_service_request_duration_seconds_count
      - bentoml_service_request_duration_seconds_sum
    # Tags estáticas (equivalentes a labels fixos no job Prometheus do curso):
    tags:
      - job:bentoml-imagens
      - service:image-processor
      - env:lab
