# Promtail: lê o JSONL didáctico e envia ao Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://bentoml-019-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bentoml
    static_configs:
      - targets:
          - localhost
        labels:
          job: bentoml
          service: image-processor
          __path__: /var/log/bentoml/bentoml_requests.jsonl
    pipeline_stages:
      - json:
          expressions:
            logged_at: logged_at
            endpoint: endpoint
            message: message
            phase: phase
            latency_ms: latency_ms
      - labels:
          endpoint:
          phase:
      - timestamp:
          source: logged_at
          format: RFC3339
      - output:
          source: message
